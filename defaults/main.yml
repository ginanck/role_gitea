---
# defaults file for role_gitea
# Releases: https://gitea.io/en-us/ / https://github.com/go-gitea/gitea/releases

# =============================================================================
# Core Configuration
# =============================================================================

gitea_version: "1.23.4"
gitea_user: gitea
gitea_group: gitea
gitea_shell: /bin/bash
gitea_create_user: true

# Architecture mapping (auto-detected)
# Supported: amd64, arm64, armv6
# gitea_arch: "amd64"

# =============================================================================
# Download & Installation
# =============================================================================

gitea_download_url: "https://dl.gitea.com/gitea/{{ gitea_version }}/gitea-{{ gitea_version }}-linux-{{ gitea_arch }}"
gitea_checksum_url: "https://dl.gitea.com/gitea/{{ gitea_version }}/gitea-{{ gitea_version }}-linux-{{ gitea_arch }}.sha256"
gitea_gpg_key_url: "https://keys.openpgp.org/vks/v1/by-fingerprint/7C9E68152594688862D62AF62D9AE806EC1592E2"
gitea_gpg_signature_url: "https://dl.gitea.com/gitea/{{ gitea_version }}/gitea-{{ gitea_version }}-linux-{{ gitea_arch }}.asc"
gitea_verify_gpg: true

# =============================================================================
# Paths
# =============================================================================

gitea_dir: "/opt/gitea"
gitea_versioned_dir: "{{ gitea_dir }}/{{ gitea_version }}"
gitea_binary_path: "{{ gitea_versioned_dir }}/gitea"
gitea_binary_link_path: "/usr/local/bin"
gitea_config_dir: "/etc/gitea"
gitea_config_path: "{{ gitea_config_dir }}/app.ini"
gitea_data_dir: "/var/lib/gitea"
gitea_custom_dir: "{{ gitea_data_dir }}/custom"
gitea_log_dir: "/var/log/gitea"
gitea_work_dir: "{{ gitea_data_dir }}"
gitea_home_dir: "{{ gitea_data_dir }}"
gitea_tmp_dir: "/tmp/gitea"

# Repository storage
gitea_repository_root: "{{ gitea_data_dir }}/repositories"
gitea_lfs_content_path: "{{ gitea_data_dir }}/lfs"

# =============================================================================
# Service Configuration
# =============================================================================

gitea_service_name: gitea
gitea_service_enabled: true
gitea_service_state: started

# =============================================================================
# Server Configuration
# =============================================================================

gitea_server_protocol: http
gitea_server_domain: localhost
gitea_server_root_url: "{{ gitea_server_protocol }}://{{ gitea_server_domain }}:{{ gitea_server_http_port }}/"
gitea_server_http_addr: "0.0.0.0"
gitea_server_http_port: 3000
gitea_server_ssh_domain: "{{ gitea_server_domain }}"
gitea_server_ssh_port: 22
gitea_server_start_ssh_server: false
gitea_server_offline_mode: false
gitea_server_landing_page: home
gitea_server_lfs_start_server: true
gitea_server_lfs_jwt_secret: ""

# =============================================================================
# Database Configuration
# =============================================================================

# Supported: sqlite3, mysql, postgres
gitea_db_type: sqlite3
gitea_db_host: "127.0.0.1:3306"
gitea_db_name: gitea
gitea_db_user: gitea
gitea_db_password: ""
gitea_db_path: "{{ gitea_data_dir }}/gitea.db"
gitea_db_ssl_mode: disable
gitea_db_charset: utf8mb4
gitea_db_log_sql: false

# =============================================================================
# Security
# =============================================================================

gitea_secret_key: ""
gitea_internal_token: ""
gitea_install_lock: true
gitea_disable_git_hooks: true
gitea_password_complexity: "off"
gitea_min_password_length: 8

# =============================================================================
# Repository Defaults
# =============================================================================

gitea_repository_default_branch: main
gitea_repository_default_private: last
gitea_repository_max_creation_limit: -1
gitea_repository_mirror_queue_length: 1000
gitea_repository_pull_request_default_merge_style: merge
gitea_repository_force_private: false
gitea_repository_disabled_types: ""

# =============================================================================
# Service Settings (User Registration & Access)
# =============================================================================

gitea_service_register_email_confirm: false
gitea_service_enable_notify_mail: false
gitea_service_disable_registration: false
gitea_service_allow_only_external_registration: false
gitea_service_require_signin_view: false
gitea_service_default_keep_email_private: false
gitea_service_default_allow_create_organization: true
gitea_service_enable_timetracking: true
gitea_service_default_enable_timetracking: true
gitea_service_no_reply_address: "noreply.{{ gitea_server_domain }}"

# =============================================================================
# Mailer Configuration
# =============================================================================

gitea_mailer_enabled: false
gitea_mailer_protocol: smtp+starttls
gitea_mailer_smtp_addr: ""
gitea_mailer_smtp_port: 587
gitea_mailer_user: ""
gitea_mailer_password: ""
gitea_mailer_from: ""

# =============================================================================
# Session Configuration
# =============================================================================

gitea_session_provider: file
gitea_session_provider_config: "{{ gitea_data_dir }}/sessions"

# =============================================================================
# Cache Configuration
# =============================================================================

gitea_cache_adapter: memory
gitea_cache_host: ""
gitea_cache_interval: 60

# =============================================================================
# Indexer Configuration
# =============================================================================

gitea_indexer_issue_type: bleve
gitea_indexer_issue_path: "{{ gitea_data_dir }}/indexers/issues.bleve"
gitea_indexer_repo_enabled: true
gitea_indexer_repo_path: "{{ gitea_data_dir }}/indexers/repos.bleve"
gitea_indexer_repo_type: bleve

# =============================================================================
# Log Configuration
# =============================================================================

gitea_log_mode: console
gitea_log_level: Info
gitea_log_root_path: "{{ gitea_log_dir }}"

# =============================================================================
# OAuth2 / JWT
# =============================================================================

gitea_oauth2_enabled: true
gitea_oauth2_jwt_secret: ""

# =============================================================================
# Actions (CI/CD Runner Support)
# =============================================================================

gitea_actions_enabled: false

# =============================================================================
# Picture / Avatar
# =============================================================================

gitea_picture_gravatar_source: gravatar
gitea_picture_disable_gravatar: false
gitea_picture_enable_federated_avatar: true

# =============================================================================
# Attachment Configuration
# =============================================================================

gitea_attachment_enabled: true
gitea_attachment_path: "{{ gitea_data_dir }}/attachments"
gitea_attachment_max_size: 4
gitea_attachment_allowed_types: ""

# =============================================================================
# Backup Configuration
# =============================================================================

gitea_backup_enabled: false
gitea_backup_dir: "/opt/gitea/backups"
gitea_backup_schedule: "*-*-* 02:00:00"
gitea_backup_type: zip
gitea_backup_retention_days: 30

# =============================================================================
# Fail2ban Configuration
# =============================================================================

gitea_fail2ban_enabled: false
gitea_fail2ban_maxretry: 5
gitea_fail2ban_findtime: 3600
gitea_fail2ban_bantime: 900
gitea_fail2ban_action: "%(action_mwl)s"

# =============================================================================
# Systemd Hardening
# =============================================================================

gitea_systemd_cap_net_bind_service: false

# =============================================================================
# Additional app.ini Sections (Advanced)
# =============================================================================

# Pass arbitrary key-value pairs to app.ini sections not covered above.
# Example:
#   gitea_extra_config:
#     webhook:
#       DELIVER_TIMEOUT: 30
#       ALLOWED_HOST_LIST: "external"
#     cron:
#       ENABLED: true
#     "cron.sync_external_users":
#       SCHEDULE: "@every 24h"
#       UPDATE_EXISTING: true
gitea_extra_config: {}

# =============================================================================
# Prerequisite Packages
# =============================================================================

gitea_prerequisite_packages:
  - git
  - gnupg
