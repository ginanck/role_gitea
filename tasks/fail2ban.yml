---
# tasks/fail2ban.yml — Configure fail2ban filter and jail for Gitea

- name: Deploy Gitea Fail2ban Filter
  ansible.builtin.template:
    src: fail2ban-filter.conf.j2
    dest: /etc/fail2ban/filter.d/gitea.conf
    owner: root
    group: root
    mode: "0644"
  notify: "gitea fail2ban changed"

- name: Deploy Gitea Fail2ban Jail
  ansible.builtin.template:
    src: fail2ban-jail.conf.j2
    dest: /etc/fail2ban/jail.d/gitea.conf
    owner: root
    group: root
    mode: "0644"
  notify: "gitea fail2ban changed"
