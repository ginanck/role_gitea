---
# tasks/generate_secrets.yml — Generate Gitea secrets if not provided

- name: Check If Gitea Configuration Already Exists
  ansible.builtin.stat:
    path: "{{ gitea_config_path }}"
  register: gitea_config_stat

# ---------------------------------------------------------------------------
# When configuration already exists, preserve secrets from the existing file
# ---------------------------------------------------------------------------

- name: Read Existing SECRET_KEY
  ansible.builtin.shell:
    cmd: awk -F' = ' '/^SECRET_KEY/{print $2}' "{{ gitea_config_path }}"
    executable: /bin/bash
  register: _existing_secret_key
  changed_when: false
  failed_when: false
  when:
    - gitea_config_stat.stat.exists
    - gitea_secret_key | length == 0

- name: Read Existing INTERNAL_TOKEN
  ansible.builtin.shell:
    cmd: awk -F' = ' '/^INTERNAL_TOKEN/{print $2}' "{{ gitea_config_path }}"
    executable: /bin/bash
  register: _existing_internal_token
  changed_when: false
  failed_when: false
  when:
    - gitea_config_stat.stat.exists
    - gitea_internal_token | length == 0

- name: Read Existing LFS_JWT_SECRET
  ansible.builtin.shell:
    cmd: awk -F' = ' '/^LFS_JWT_SECRET/{print $2}' "{{ gitea_config_path }}"
    executable: /bin/bash
  register: _existing_lfs_jwt_secret
  changed_when: false
  failed_when: false
  when:
    - gitea_config_stat.stat.exists
    - gitea_server_lfs_jwt_secret | length == 0

- name: Read Existing OAuth2 JWT_SECRET
  ansible.builtin.shell:
    cmd: awk '/^\[oauth2\]/,/^\[/' "{{ gitea_config_path }}" | awk -F' = ' '/^JWT_SECRET/{print $2}'
    executable: /bin/bash
  register: _existing_oauth2_jwt_secret
  changed_when: false
  failed_when: false
  when:
    - gitea_config_stat.stat.exists
    - gitea_oauth2_jwt_secret | length == 0

- name: Preserve Existing Secrets from Configuration
  ansible.builtin.set_fact:
    gitea_secret_key: "{{ _existing_secret_key.stdout | default(gitea_secret_key, true) | trim }}"
    gitea_internal_token: "{{ _existing_internal_token.stdout | default(gitea_internal_token, true) | trim }}"
    gitea_server_lfs_jwt_secret: "{{ _existing_lfs_jwt_secret.stdout | default(gitea_server_lfs_jwt_secret, true) | trim }}"
    gitea_oauth2_jwt_secret: "{{ _existing_oauth2_jwt_secret.stdout | default(gitea_oauth2_jwt_secret, true) | trim }}"
  when: gitea_config_stat.stat.exists

# ---------------------------------------------------------------------------
# When no configuration exists, generate new secrets
# ---------------------------------------------------------------------------

- name: Generate SECRET_KEY
  ansible.builtin.command:
    cmd: "{{ gitea_binary_link_path }}/gitea generate secret SECRET_KEY"
  register: gitea_generated_secret_key
  changed_when: false
  when:
    - gitea_secret_key | length == 0
    - not gitea_config_stat.stat.exists

- name: Generate INTERNAL_TOKEN
  ansible.builtin.command:
    cmd: "{{ gitea_binary_link_path }}/gitea generate secret INTERNAL_TOKEN"
  register: gitea_generated_internal_token
  changed_when: false
  when:
    - gitea_internal_token | length == 0
    - not gitea_config_stat.stat.exists

- name: Generate LFS_JWT_SECRET
  ansible.builtin.command:
    cmd: "{{ gitea_binary_link_path }}/gitea generate secret LFS_JWT_SECRET"
  register: gitea_generated_lfs_jwt_secret
  changed_when: false
  when:
    - gitea_server_lfs_jwt_secret | length == 0
    - gitea_server_lfs_start_server
    - not gitea_config_stat.stat.exists

- name: Generate OAUTH2 JWT_SECRET
  ansible.builtin.command:
    cmd: "{{ gitea_binary_link_path }}/gitea generate secret JWT_SECRET"
  register: gitea_generated_oauth2_jwt_secret
  changed_when: false
  when:
    - gitea_oauth2_jwt_secret | length == 0
    - gitea_oauth2_enabled
    - not gitea_config_stat.stat.exists

- name: Set Generated Secret Facts
  ansible.builtin.set_fact:
    gitea_secret_key: "{{ gitea_generated_secret_key.stdout | default(gitea_secret_key, true) }}"
    gitea_internal_token: "{{ gitea_generated_internal_token.stdout | default(gitea_internal_token, true) }}"
    gitea_server_lfs_jwt_secret: "{{ gitea_generated_lfs_jwt_secret.stdout | default(gitea_server_lfs_jwt_secret, true) }}"
    gitea_oauth2_jwt_secret: "{{ gitea_generated_oauth2_jwt_secret.stdout | default(gitea_oauth2_jwt_secret, true) }}"
  when: not gitea_config_stat.stat.exists
