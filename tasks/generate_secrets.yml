---
# tasks/generate_secrets.yml — Generate and persist Gitea secrets
#
# Secrets are stored in a dedicated YAML file (gitea_secrets_file) that Gitea
# never touches.  On subsequent runs the file is read back and the same values
# are fed to the app.ini template, guaranteeing idempotence.
#
# Set gitea_force_regenerate_secrets: true to regenerate all secrets.

- name: Check If Secrets File Already Exists
  ansible.builtin.stat:
    path: "{{ gitea_secrets_file }}"
  register: _secrets_file_stat

# ---------------------------------------------------------------------------
# When secrets file exists and force regenerate is not requested, load it
# ---------------------------------------------------------------------------

- name: Read Existing Secrets File
  ansible.builtin.slurp:
    src: "{{ gitea_secrets_file }}"
  register: _secrets_file_content
  when:
    - _secrets_file_stat.stat.exists
    - not gitea_force_regenerate_secrets

- name: Load Secrets from File
  ansible.builtin.set_fact:
    _loaded_secrets: "{{ _secrets_file_content.content | b64decode | from_yaml }}"
  when:
    - _secrets_file_stat.stat.exists
    - not gitea_force_regenerate_secrets

- name: Set Secret Facts from Existing File
  ansible.builtin.set_fact:
    gitea_secret_key: "{{ gitea_secret_key if gitea_secret_key | length > 0 else _loaded_secrets.gitea_secret_key }}"
    gitea_internal_token: "{{ gitea_internal_token if gitea_internal_token | length > 0 else _loaded_secrets.gitea_internal_token }}"
    gitea_server_lfs_jwt_secret: "{{ gitea_server_lfs_jwt_secret if gitea_server_lfs_jwt_secret | length > 0 else _loaded_secrets.gitea_server_lfs_jwt_secret }}"
    gitea_oauth2_jwt_secret: "{{ gitea_oauth2_jwt_secret if gitea_oauth2_jwt_secret | length > 0 else _loaded_secrets.gitea_oauth2_jwt_secret }}"
  when:
    - _secrets_file_stat.stat.exists
    - not gitea_force_regenerate_secrets

# ---------------------------------------------------------------------------
# When secrets file does not exist or force regenerate is requested, generate
# new secrets using the Gitea binary and persist them
# ---------------------------------------------------------------------------

- name: Generate SECRET_KEY
  ansible.builtin.command:
    cmd: "{{ gitea_binary_link_path }}/gitea generate secret SECRET_KEY"
  register: _generated_secret_key
  changed_when: false
  when:
    - gitea_secret_key | length == 0
    - not _secrets_file_stat.stat.exists or gitea_force_regenerate_secrets

- name: Generate INTERNAL_TOKEN
  ansible.builtin.command:
    cmd: "{{ gitea_binary_link_path }}/gitea generate secret INTERNAL_TOKEN"
  register: _generated_internal_token
  changed_when: false
  when:
    - gitea_internal_token | length == 0
    - not _secrets_file_stat.stat.exists or gitea_force_regenerate_secrets

- name: Generate LFS_JWT_SECRET
  ansible.builtin.command:
    cmd: "{{ gitea_binary_link_path }}/gitea generate secret LFS_JWT_SECRET"
  register: _generated_lfs_jwt_secret
  changed_when: false
  when:
    - gitea_server_lfs_jwt_secret | length == 0
    - gitea_server_lfs_start_server
    - not _secrets_file_stat.stat.exists or gitea_force_regenerate_secrets

- name: Generate OAuth2 JWT_SECRET
  ansible.builtin.command:
    cmd: "{{ gitea_binary_link_path }}/gitea generate secret JWT_SECRET"
  register: _generated_oauth2_jwt_secret
  changed_when: false
  when:
    - gitea_oauth2_jwt_secret | length == 0
    - gitea_oauth2_enabled
    - not _secrets_file_stat.stat.exists or gitea_force_regenerate_secrets

- name: Set Generated Secret Facts
  ansible.builtin.set_fact:
    gitea_secret_key: "{{ _generated_secret_key.stdout | default(gitea_secret_key, true) | trim }}"
    gitea_internal_token: "{{ _generated_internal_token.stdout | default(gitea_internal_token, true) | trim }}"
    gitea_server_lfs_jwt_secret: "{{ _generated_lfs_jwt_secret.stdout | default(gitea_server_lfs_jwt_secret, true) | trim }}"
    gitea_oauth2_jwt_secret: "{{ _generated_oauth2_jwt_secret.stdout | default(gitea_oauth2_jwt_secret, true) | trim }}"
  when:
    - not _secrets_file_stat.stat.exists or gitea_force_regenerate_secrets

- name: Persist Secrets to File
  ansible.builtin.copy:
    content: |
      ---
      gitea_secret_key: "{{ gitea_secret_key }}"
      gitea_internal_token: "{{ gitea_internal_token }}"
      gitea_server_lfs_jwt_secret: "{{ gitea_server_lfs_jwt_secret }}"
      gitea_oauth2_jwt_secret: "{{ gitea_oauth2_jwt_secret }}"
    dest: "{{ gitea_secrets_file }}"
    owner: "{{ gitea_user }}"
    group: "{{ gitea_group }}"
    mode: "0600"
  when:
    - not _secrets_file_stat.stat.exists or gitea_force_regenerate_secrets
