---
# tasks/manage_local_users.yml — Create/remove local Gitea users via CLI

- name: Flush Handlers to Ensure Gitea Is Running Before User Management
  ansible.builtin.meta: flush_handlers

- name: Wait for Gitea Service to Be Ready
  ansible.builtin.uri:
    url: "{{ gitea_server_protocol }}://127.0.0.1:{{ gitea_server_http_port }}/"
    method: GET
    status_code: 200
    validate_certs: false
  register: gitea_health_users
  retries: 10
  delay: 5
  until: gitea_health_users.status == 200

- name: List Existing Gitea Users
  ansible.builtin.command:
    cmd: >-
      {{ gitea_binary_link_path }}/gitea admin user list
      --config {{ gitea_config_path }}
  register: gitea_existing_users
  changed_when: false
  become: true
  become_user: "{{ gitea_user }}"
  environment:
    GITEA_WORK_DIR: "{{ gitea_work_dir }}"
    HOME: "{{ gitea_home_dir }}"

- name: Create Local Gitea Users
  ansible.builtin.command:
    cmd: >-
      {{ gitea_binary_link_path }}/gitea admin user create
      --config {{ gitea_config_path }}
      --username "{{ item.username }}"
      --password "{{ item.password }}"
      --email "{{ item.email }}"
      {% if item.admin | default(false) %}--admin{% endif %}
      --must-change-password={{ item.must_change_password | default(true) | lower }}
  loop: "{{ gitea_local_users | selectattr('state', 'undefined') | list + gitea_local_users | selectattr('state', 'defined') | selectattr('state', 'equalto', 'present') | list }}"
  loop_control:
    label: "{{ item.username }}"
  when: item.username not in gitea_existing_users.stdout
  changed_when: true
  become: true
  become_user: "{{ gitea_user }}"
  environment:
    GITEA_WORK_DIR: "{{ gitea_work_dir }}"
    HOME: "{{ gitea_home_dir }}"
  no_log: true

- name: Delete Local Gitea Users
  ansible.builtin.command:
    cmd: >-
      {{ gitea_binary_link_path }}/gitea admin user delete
      --config {{ gitea_config_path }}
      --username "{{ item.username }}"
  loop: "{{ gitea_local_users | selectattr('state', 'defined') | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    label: "{{ item.username }}"
  when: item.username in gitea_existing_users.stdout
  changed_when: true
  become: true
  become_user: "{{ gitea_user }}"
  environment:
    GITEA_WORK_DIR: "{{ gitea_work_dir }}"
    HOME: "{{ gitea_home_dir }}"
