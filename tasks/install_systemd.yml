---
# tasks/install_systemd.yml — Deploy systemd service unit and start Gitea

- name: Deploy Gitea Systemd Service File
  ansible.builtin.template:
    src: gitea.service.j2
    dest: /etc/systemd/system/{{ gitea_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart gitea

- name: Enable and Start Gitea Service
  ansible.builtin.systemd:
    name: "{{ gitea_service_name }}"
    enabled: "{{ gitea_service_enabled }}"
    state: "{{ gitea_service_state }}"
    daemon_reload: true
