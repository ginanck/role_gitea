---
# tasks/backup.yml — Configure scheduled backups via systemd timer
#
# `gitea dump` always includes a database dump (gitea-db.sql), repositories,
# data, custom files and app.ini, so a backup is restorable with
# tasks/restore.yml.

- name: Validate Backup Retention
  ansible.builtin.assert:
    that:
      - gitea_backup_retention_days | int >= 1
    fail_msg: "gitea_backup_retention_days must be at least 1"

- name: Ensure Backup Directory Exists
  ansible.builtin.file:
    path: "{{ gitea_backup_dir }}"
    state: directory
    owner: "{{ gitea_user }}"
    group: "{{ gitea_group }}"
    mode: "0750"

- name: Deploy Gitea Backup Service Unit
  ansible.builtin.template:
    src: gitea-backup.service.j2
    dest: /etc/systemd/system/gitea-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Deploy Gitea Backup Timer Unit
  ansible.builtin.template:
    src: gitea-backup.timer.j2
    dest: /etc/systemd/system/gitea-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Flush Handlers to Reload Systemd Before Timer Start
  ansible.builtin.meta: flush_handlers

- name: Enable and Start Gitea Backup Timer
  ansible.builtin.systemd:
    name: gitea-backup.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Clean Old Backups
  ansible.builtin.command:
    cmd: >-
      find {{ gitea_backup_dir }} -maxdepth 1 -type f
      -name 'gitea-backup-*'
      -mtime +{{ gitea_backup_retention_days | int }}
  register: gitea_old_backups
  changed_when: false

- name: Remove Expired Backup Files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ gitea_old_backups.stdout_lines }}"
  loop_control:
    label: "{{ item | basename }}"
  when: gitea_old_backups.stdout_lines | length > 0
