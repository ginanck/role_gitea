---
# tasks/create_directories.yml — Create required directory structure

- name: Create Gitea Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(gitea_user) }}"
    group: "{{ item.group | default(gitea_group) }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    - { path: "{{ gitea_dir }}" }
    - { path: "{{ gitea_versioned_dir }}" }
    - { path: "{{ gitea_config_dir }}", mode: "0770" }
    - { path: "{{ gitea_data_dir }}" }
    - { path: "{{ gitea_custom_dir }}" }
    - { path: "{{ gitea_log_dir }}" }
    - { path: "{{ gitea_repository_root }}" }
    - { path: "{{ gitea_lfs_content_path }}" }
    - { path: "{{ gitea_tmp_dir }}", mode: "0750" }
  loop_control:
    label: "{{ item.path }}"

- name: Create Gitea Backup Directory
  ansible.builtin.file:
    path: "{{ gitea_backup_dir }}"
    state: directory
    owner: "{{ gitea_user }}"
    group: "{{ gitea_group }}"
    mode: "0750"
  when: gitea_backup_enabled
