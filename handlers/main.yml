---
# handlers file for role_gitea

- name: restart gitea
  ansible.builtin.systemd:
    name: "{{ gitea_service_name }}"
    state: restarted
    enabled: true
    daemon_reload: true

- name: reload gitea
  ansible.builtin.systemd:
    name: "{{ gitea_service_name }}"
    state: reloaded

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  listen: "gitea fail2ban changed"
