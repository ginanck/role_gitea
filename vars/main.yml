---
# vars file for role_gitea — internal constants

# Architecture mapping from ansible_architecture to Gitea download naming
gitea_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: arm-6
  armv6l: arm-6

gitea_arch: "{{ gitea_arch_map[ansible_facts['architecture']] | default('amd64') }}"

# GPG key fingerprint for Gitea release signing
gitea_gpg_key_fingerprint: "7C9E68152594688862D62AF62D9AE806EC1592E2"
